name: Formal rehearsal macOS

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify-target-macos:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request')
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout verified candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert target runtime
        run: test "$(node -p 'process.platform')" = "darwin"

      - name: Run formal prepare, real OpenNext artifact, and no-network rehearsal
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run test:run -- tests/scripts/issue-23-delivery-prepare.test.ts --reporter=verbose

      - name: Run Issue #92 formal rehearsal macOS exact gate
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run test:run -- tests/scripts/issue-92-formal-rehearsal.test.ts --reporter=verbose
