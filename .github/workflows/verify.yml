name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quick verification
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run verify:quick

  verify-target-macos:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert target runtime
        run: test "$(node -p 'process.platform')" = "darwin"

      - name: Run formal prepare, real OpenNext artifact, and no-network rehearsal
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: '1'
          GH_TOKEN: ${{ github.token }}
        run: npm run test:run -- tests/scripts/issue-23-delivery-prepare.test.ts --reporter=verbose

      - name: Run Issue #92 formal rehearsal macOS exact gate
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: '1'
          GH_TOKEN: ${{ github.token }}
        run: npm run test:run -- tests/scripts/issue-92-formal-rehearsal.test.ts --reporter=verbose

      - name: Run Darwin canonical-overlap durability regression
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run test:run -- tests/scripts/issue-23-delivery-durability.test.ts -t 'case-equivalent canonical namespace alias' --reporter=verbose

  verify-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Classify migration changes
        id: migration-changes
        shell: bash
        run: |
          set -euo pipefail
          if output="$(node scripts/verify-migrations-required.mjs)"; then
            printf '%s\n' "${output}" >> "${GITHUB_OUTPUT}"
          else
            printf 'required=true\nreason=classifier-failed\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Report migration verification not required
        if: steps.migration-changes.outputs.required == 'false'
        run: 'echo "verify-migrations: not-required"'

      - name: Install dependencies
        if: steps.migration-changes.outputs.required != 'false'
        run: npm ci

      - name: Run long migration verification
        if: steps.migration-changes.outputs.required != 'false'
        env:
          CI: true
        run: npm run test:run -- tests/migrations/migration-runner.test.ts --reporter=verbose
