name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 40 — the quick suite carries real-D1 table-driven tests (repositories,
    # delivery preparation) and brushes the previous 30-minute ceiling.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quick verification
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run verify:quick

  verify-target-macos:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert target runtime
        run: test "$(node -p 'process.platform')" = "darwin"

      - name: Run formal prepare, real OpenNext artifact, and no-network rehearsal
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: '1'
          GH_TOKEN: ${{ github.token }}
        run: npm run test:run -- tests/scripts/issue-23-delivery-prepare.test.ts --reporter=verbose

      - name: Run Issue #92 formal rehearsal macOS exact gate
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: '1'
          GH_TOKEN: ${{ github.token }}
        run: npm run test:run -- tests/scripts/issue-92-formal-rehearsal.test.ts --reporter=verbose

      - name: Run Darwin canonical-overlap durability regression
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run test:run -- tests/scripts/issue-23-delivery-durability.test.ts -t 'case-equivalent canonical namespace alias' --reporter=verbose

  verify-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Classify migration changes
        id: migration-changes
        shell: bash
        run: |
          set -euo pipefail
          if output="$(node scripts/verify-migrations-required.mjs)"; then
            printf '%s\n' "${output}" >> "${GITHUB_OUTPUT}"
          else
            printf 'required=true\nreason=classifier-failed\n' >> "${GITHUB_OUTPUT}"
          fi

      # A newer run may cancel unverified migration inputs from any earlier
      # commit. Classify paths for diagnostics, never as permission to skip.
      - name: Install dependencies
        run: npm ci

      - name: Run long migration verification
        id: migration-tests
        env:
          CI: true
        run: npm run test:run -- tests/migrations/migration-runner.test.ts --reporter=verbose

      - name: Report actual migration verification outcome
        if: always()
        env:
          CLASSIFICATION_REASON: ${{ steps.migration-changes.outputs.reason }}
          MIGRATION_OUTCOME: ${{ steps.migration-tests.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '### Migration verification\n\n'
            printf -- '- Candidate: `%s`\n' "$(git rev-parse HEAD)"
            printf -- '- Run/attempt: %s/%s/actions/runs/%s/attempts/%s\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
            printf -- '- Job: `verify-migrations`\n'
            printf -- '- Policy: every candidate must execute the migration suite\n'
            printf -- '- Classification: `%s`\n' "${CLASSIFICATION_REASON:-unavailable}"
            printf -- '- Actual test step outcome: `%s`\n' "${MIGRATION_OUTCOME:-not-executed}"
            printf -- '- Only `success` is passing test evidence; skipped, cancelled, or missing results are not.\n'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
